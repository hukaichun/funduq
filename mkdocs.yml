site_name: funduq
site_description: The network-free core of funduq — design, contracts, and guides
site_url: https://hukaichun.github.io/funduq/
repo_url: https://github.com/hukaichun/funduq
repo_name: hukaichun/funduq
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - navigation.indexes
    - navigation.top
    - content.action.edit
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - What each half is for: responsibilities.md
  - The integration contract: integration-contract.md
  - The agent loop: agent-loop.md
  - What a deployment has to know: operational-limits.md
  - Contract changelog: contract-changelog.md
  - Releasing: releasing.md
  - SDKs:
      - sdks.md
      - funduq-contract: sdks/contract.md
      - funduq-provider-sdk: sdks/provider-sdk.md
      - Serving completions (the llm extra): sdks/llm-provider-sdk.md
  - Writing a transport: writing-a-transport.md
  - The link protocol machine: link-protocol-machine.md
