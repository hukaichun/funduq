# Publishing to PyPI. One entrance: a version bump reaching main.
#
# There is no API token here and there is not meant to be. PyPI trusts this
# repository, this workflow *file* and one named environment per project, and
# GitHub mints a short-lived OIDC token per run — so nothing long-lived is
# stored anywhere, and revoking a publisher is a click rather than a secret
# rotation. For a project whose subject is identity and keys, a password in a
# repository secret would be the wrong first impression.
#
# **The name of this file is part of the configuration**, as are the
# environment names below and `hukaichun/funduq` itself. Renaming any of them
# breaks publishing silently.
#
# One job per distribution, each with its own environment, because PyPI
# refuses to register one (owner, repo, workflow, environment) against more
# than one project name. Worth keeping rather than working around: one
# configuration able to publish several names is one thing to compromise for
# all of them, so each target gets an entrance revocable on its own.
#
# ## Why the version in pyproject.toml is what triggers this
#
# A version lives in exactly one place a human writes, and it is reviewed as
# part of a diff like anything else. The tag is written afterwards, by this
# workflow, out of that same number — so the two cannot disagree, and a tag
# existing means that version really went out.
#
# The obvious alternative fails here, and not gently. Deriving the version
# from the tag (hatch-vcs and friends) means `git describe`, which finds the
# nearest reachable tag whatever its prefix: with three interleaved tag series
# in one repository, building funduq-contract just after a provider-sdk
# release yields the provider-sdk version, silently, and PyPI accepts it. Each
# package can be given its own `--match` pattern, but the failure mode of
# getting that wrong is a wrong version published rather than an error.
#
# The other obvious alternative — this workflow pushes a tag and a second
# workflow publishes on it — cannot work at all: events created with
# GITHUB_TOKEN do not start workflow runs. Publishing would simply never
# happen, which is the worst way for a release to fail. Detection and
# publication are therefore one workflow, and a personal access token is not
# needed for anything.
#
# ## The gate
#
# Merging a version bump publishes, and PyPI is irreversible. The pause is
# the environment: give each of the three a required reviewer and every
# upload stops for a human first.

name: release

on:
  push:
    branches: [main]

jobs:
  # One place decides what is being released, so three publish jobs cannot
  # each re-derive it and disagree.
  detect:
    runs-on: ubuntu-latest
    outputs:
      funduq-contract: ${{ steps.diff.outputs.funduq-contract }}
      funduq: ${{ steps.diff.outputs.funduq }}
      funduq-provider-sdk: ${{ steps.diff.outputs.funduq-provider-sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This commit and the one before it: the whole question is what
          # changed between them.
          fetch-depth: 2

      - id: diff
        name: which distributions declare a new version
        # An unreadable pyproject.toml must be an error, never a release
        # signal. Written out rather than left to `set -e`: an empty `now`
        # compares unequal to every previous version, so a malformed file
        # would read as "the version changed" — correctness resting on a
        # shell subtlety, for the one decision in this file that must not be
        # wrong.
        run: |
          set -euo pipefail

          for package in funduq-contract funduq funduq-provider-sdk; do
            if ! now=$(python -c "
          import tomllib
          print(tomllib.load(open('$package/pyproject.toml','rb'))['project']['version'])
          "); then
              echo "::error::$package/pyproject.toml declares no readable version"
              exit 1
            fi

            # A package added in this commit has no previous file at all, and
            # that is the one absence which legitimately means "new".
            if git cat-file -e "HEAD^:$package/pyproject.toml" 2>/dev/null; then
              if ! before=$(git show "HEAD^:$package/pyproject.toml" | python -c "
          import sys, tomllib
          print(tomllib.loads(sys.stdin.read())['project']['version'])
          "); then
                echo "::error::$package/pyproject.toml was unreadable in the previous commit"
                exit 1
              fi
            else
              before=""
              echo "$package: new in this commit"
            fi

            if [ "$now" != "$before" ]; then
              echo "$package: ${before:-none} -> $now"
              echo "$package=$now" >> "$GITHUB_OUTPUT"
            else
              echo "$package: unchanged at $now"
              echo "$package=" >> "$GITHUB_OUTPUT"
            fi
          done

  # funduq-contract goes first when several move together: the other two
  # declare it as a dependency, and an install resolves nothing until it
  # exists. The `always()` in the two below is what lets them run when this
  # one was skipped rather than failed.
  publish-funduq-contract:
    needs: detect
    if: needs.detect.outputs.funduq-contract != ''
    runs-on: ubuntu-latest
    environment: pypi-funduq-contract
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv build --wheel --sdist -o dist funduq-contract
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Last, and only on success: a tag here means that version is on PyPI.
      # Written the other way round, a failed upload would leave a tag
      # pointing at something nobody can install.
      - run: |
          git tag "funduq-contract-v${{ needs.detect.outputs.funduq-contract }}"
          git push origin "funduq-contract-v${{ needs.detect.outputs.funduq-contract }}"

  publish-funduq:
    needs: [detect, publish-funduq-contract]
    if: always() && !failure() && !cancelled() && needs.detect.outputs.funduq != ''
    runs-on: ubuntu-latest
    environment: pypi-funduq
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv build --wheel --sdist -o dist funduq
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: |
          git tag "funduq-v${{ needs.detect.outputs.funduq }}"
          git push origin "funduq-v${{ needs.detect.outputs.funduq }}"

  publish-funduq-provider-sdk:
    needs: [detect, publish-funduq-contract]
    if: always() && !failure() && !cancelled() && needs.detect.outputs.funduq-provider-sdk != ''
    runs-on: ubuntu-latest
    environment: pypi-funduq-provider-sdk
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv build --wheel --sdist -o dist funduq-provider-sdk
      - uses: pypa/gh-action-pypi-publish@release/v1
      - run: |
          git tag "funduq-provider-sdk-v${{ needs.detect.outputs.funduq-provider-sdk }}"
          git push origin "funduq-provider-sdk-v${{ needs.detect.outputs.funduq-provider-sdk }}"
