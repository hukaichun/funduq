name: CI

on:
  push:
  pull_request:

# Mirrors the repo's own "independent projects" shape (see README's
# Components section) — one job per subproject rather than one monolithic
# build, since any one of them can be built/shipped/forked on its own.
jobs:
  funduq:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: funduq
          POSTGRES_PASSWORD: funduq
          POSTGRES_DB: funduq
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: funduq
      # No gRPC stubs here, and nothing to generate them with: funduq depends
      # on no transport at all (see its pyproject). If this step ever comes
      # back, something has moved into core that shouldn't have.
      - run: uv run pytest -v
        working-directory: funduq
        env:
          FUNDUQ_DATABASE_URL: postgresql+psycopg://funduq:funduq@localhost:5432/funduq
          FUNDUQ_TOKEN_SIGNING_SECRET: ci-test-secret

      # The probes, which are the acceptance checks the design documents name
      # — a green suite is not the bar. Four separate breakages of delivery
      # once left the pass count unchanged, because every test that drove a
      # run was already failing for an unrelated reason. Each probe below
      # reproduces a specific failure and exits non-zero if the verdict has
      # not changed.
      #
      # Two of the six probes are deliberately *not* here.
      # `probe_multiprocess.py` is the target for the horizontal-scaling work
      # and currently fails 8/8 on purpose — re-measured 2026-08-27, after it
      # was ported from the retired `claim_work` to handed-down dispatch, on
      # SQLite and Postgres alike; `probe_broker_surface.py` reports
      # what escapes the broker rather than judging it. Listing them would
      # either break CI or quietly pass, and both would teach the wrong thing
      # about what is covered.
      - name: probes (schema agrees, on Postgres)
        run: uv run python ../scripts/probes/probe_schema_agrees.py
        working-directory: funduq
        env:
          FUNDUQ_DATABASE_URL: postgresql+psycopg://funduq:funduq@localhost:5432/funduq
          FUNDUQ_TOKEN_SIGNING_SECRET: ci-test-secret
      # The rest stand up their own throwaway SQLite file, so they must not
      # inherit the Postgres DSN above.
      - name: probes (schema, run row vanishes, registration survives, silence — SQLite)
        run: |
          uv run python ../scripts/probes/probe_schema_agrees.py
          uv run python ../scripts/probes/probe_run_row_vanishes.py
          uv run python ../scripts/probes/probe_registration_survives_a_new_database.py
          uv run python ../scripts/probes/probe_nobody_says_anything.py
        working-directory: funduq
        env:
          FUNDUQ_TOKEN_SIGNING_SECRET: ci-test-secret

  funduq-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --group dev
        working-directory: funduq-contract
      # The bytes both sides sign, and nothing else: cryptography and pyjwt.
      # It holds no key, opens no socket and reads no database. If anything
      # heavier appears in its lockfile, the package stopped being what core
      # and the SDK are both allowed to depend on.
      - run: uv run pytest -v
        working-directory: funduq-contract

  funduq-provider-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      # The dev group asks for the `llm` extra, so this one job covers both
      # kinds of provider — the LLM half is `funduq_provider_sdk.llm` now,
      # not a package of its own.
      - run: uv sync --group dev
        working-directory: funduq-provider-sdk
      # No transport here, and nothing to generate one with: this package
      # defines an interaction. If a network dependency ever appears in its
      # lockfile, the boundary was not real.
      - run: uv run pytest -v
        working-directory: funduq-provider-sdk

  # A green suite says the source tree works for someone who has the source
  # tree. It says nothing about the artifact, and three of these failed the
  # first time they were built rather than imported — a `[project.urls]` table
  # that swallowed every section after it, a `license-files` entry naming a
  # LICENSE that lived only at the repo root, and a declared README that did
  # not exist. The declarations are checked offline in funduq's suite; this is
  # the part that needs a real build.
  wheels-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: build every distribution
        run: |
          for package in funduq-contract funduq funduq-provider-sdk; do
            uv build --wheel --sdist -o dist "$package"
          done
      - name: what would be published
        run: ls -la dist

  # Everything else — the gateway, both SDKs, the reference providers and
  # the directory UI — lives in funduq-server, which carries its own CI,
  # including the app-builds probe only it can run.

