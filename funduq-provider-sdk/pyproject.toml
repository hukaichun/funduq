[project]
name = "funduq-provider-sdk"
version = "0.0.7"
description = "What a provider and funduq agree on, from the provider's side: identity, the ports, and the provider's own worker loop — for an agent provider, or an LLM provider with the `llm` extra"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kai-Chun Hu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

# This package defines an interaction, not a transport: no httpx, no
# websockets, no grpcio, and no funduq. A network binding is downstream's to
# build, and if this list ever grows one of those, the boundary was not real.
#
# Not depending on funduq is what makes the signing payloads in identity.py a
# second opinion rather than an echo — see that module.
#
# ag-ui-protocol is the one exception, and a deliberate one: `thread_messages`
# hands a provider message content whose shape is AG-UI's to define, and
# every message reaching it was built from that same package on funduq's side
# (protocols.agui, or A2A translated into it — see a2a_translate.py). Passing
# that content on as a bare dict is the shape of bug this package's own
# `DeliveredRun` exists to prevent for run fields: the provider trusts field
# names nothing checks. Pinned to the version funduq itself uses, so the two
# cannot silently disagree on what a message looks like.
dependencies = [
    # The bytes both sides sign, written once. This package used to carry its
    # own copy under its own names; the reason was that it must not depend on
    # *core*, which funduq-contract satisfies without the duplication.
    "funduq-contract>=0.0.9,<0.1",
    "cryptography>=42.0",
    # Actor-chain hops are JWTs. Signing, not transport.
    "pyjwt[crypto]>=2.9",
    "ag-ui-protocol>=0.1.19",
    # Direct since the protocol frames are models: the wire form is
    # `model_dump(by_alias=True)` and `model_validate`, so pydantic is
    # something this package programs against rather than something it happens
    # to receive through ag-ui-protocol.
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Serving completions instead of (or as well as) agents. It is an extra
# rather than a package because the two SDKs were 685 lines and 197, and the
# smaller one imported nothing from the larger but `ProviderIdentity` —
# identity is identity. What kept them apart was dependency weight, and an
# extra answers that better than a distribution: `openai` drags httpx, anyio
# and a handful more, and an agent provider must not pay for it.
#
# The types, never the client. `funduq_provider_sdk.llm` is not imported by
# this package's `__init__`, so an agent provider never pays the import
# either.
llm = ["openai>=1.50"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "openai>=1.50"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
funduq-contract = { path = "../funduq-contract", editable = true }

[project.urls]
Homepage = "https://github.com/hukaichun/funduq"
Documentation = "https://hukaichun.github.io/funduq/"
Source = "https://github.com/hukaichun/funduq"
Changelog = "https://github.com/hukaichun/funduq/blob/main/docs/contract-changelog.md"
Issues = "https://github.com/hukaichun/funduq/issues"
